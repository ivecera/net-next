%YAML 1.2
---
$id: http://devicetree.org/schemas/net/micrel,lan8814-package.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Micrel LAN8814 Quad-Port Ethernet PHY Package

maintainers:
  - TODO ???

description: |
  The Micrel LAN8814 is a Quad-Port Gigabit Ethernet PHY.
  This binding describes the package container which groups the four
  individual PHYs, allowing for the management of shared resources
  such as the PTP clock, GPIOs, and global configuration registers.

allOf:
  - $ref: ethernet-phy-package.yaml#

properties:
  compatible:
    const: micrel,lan8814-package

  microchip,ptp-clock-frequency-hz:
    description:
      Frequency of the external PTP reference clock in Hertz.
    enum: [ 10000000, 25000000, 125000000 ]

patternProperties:
  ^ethernet-phy(@[a-f0-9]+)?$:
    allOf:
      - $ref: ethernet-phy.yaml#

    unevaluatedProperties: false

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    mdio {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy-package@0 {
            compatible = "micrel,lan8814-package";
            reg = <0>;
            #address-cells = <1>;
            #size-cells = <0>;

            microchip,ptp-clock-frequency-hz = <125000000>;

            ethernet-phy@0 {
                reg = <0>;
            };

            ethernet-phy@1 {
                reg = <1>;
            };

            ethernet-phy@2 {
                reg = <2>;
            };

            ethernet-phy@3 {
                reg = <3>;
            };
        };
    };
...
